# =============================================
# MiddlewareAuth — local docker-compose
# Attaches to existing Traefik network (coolify).
# Traefik service itself is defined in traefik-proxy.yml.
# =============================================

name: middleware-auth

services:
  # --- Database ------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: auth-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: auth
      POSTGRES_PASSWORD: auth
      POSTGRES_DB: auth
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U auth -d auth"]
      interval: 5s
      timeout: 3s
      retries: 10
    # NOT exposed to Traefik (no labels)

  # --- Redis ---------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: auth-redis
    restart: unless-stopped
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    # NOT exposed to Traefik

  # --- Auth Server ---------------------------------------------------
  auth-server:
    build:
      context: ./auth-server
      dockerfile: Dockerfile
    container_name: auth-server
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://auth:auth@postgres:5432/auth
      REDIS_URL: redis://redis:6379
      AUTH_SECRET: ${AUTH_SECRET:?AUTH_SECRET required}
      AUTH_URL: ${AUTH_URL:-https://auth.burakaydogan.tk}
      AUTH_TRUST_HOST: "true"
      JWT_PRIVATE_KEY: ${JWT_PRIVATE_KEY:?JWT_PRIVATE_KEY required}
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY:?JWT_PUBLIC_KEY required}
      EXPO_ACCESS_TOKEN: ${EXPO_ACCESS_TOKEN:-}
      APPROVAL_MODE: ${APPROVAL_MODE:-push}
      APPROVAL_TTL_SECONDS: ${APPROVAL_TTL_SECONDS:-300}
      NUMERIC_CODE_LENGTH: ${NUMERIC_CODE_LENGTH:-6}
      NODE_ENV: production
      # Docker runtime overrides HOSTNAME with the container ID, which breaks
      # Next.js standalone (server.js binds to process.env.HOSTNAME).
      # Pin it explicitly so the server listens on all interfaces.
      HOSTNAME: "0.0.0.0"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    labels:
      - coolify.managed=true
      - traefik.enable=true
      - traefik.docker.network=coolify
      - traefik.http.routers.auth.rule=Host(`auth.burakaydogan.tk`)
      - traefik.http.routers.auth.entrypoints=https
      - traefik.http.routers.auth.tls=true
      - traefik.http.routers.auth.tls.certresolver=letsencrypt
      - traefik.http.routers.auth.service=auth-svc
      - traefik.http.services.auth-svc.loadbalancer.server.port=3000
      # NOTE: forwardAuth middleware is defined in traefik/dynamic/auth-gateway.yml
      # (file provider) so it exists even when this container is down.
      # Reference it as: auth-gateway@file
    healthcheck:
      # -4 + 127.0.0.1: avoid IPv6 (::1) resolution inside Alpine (server listens IPv4 only)
      test: ["CMD", "wget", "-4", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
